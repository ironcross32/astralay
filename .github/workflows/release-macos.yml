name: Release (macOS)

# Builds every format and the installer, then adds the installer to the tag's GitHub release.
# Run by hand from the Actions tab, it builds the same installer and keeps it as a workflow
# artifact instead, without touching any release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The installer takes its version from the build, so a tag that disagrees with CMakeLists.txt
      # would publish a mislabelled release. Catch it before the build rather than after.
      - name: Check the tag matches the project version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^project(Astralay VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in CMakeLists.txt"
            exit 1
          fi

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Build the installer
        run: installer/mac/build-pkg.sh

      - name: Keep the installer as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Astralay-macOS-installer
          path: build/installer/*.pkg
          if-no-files-found: error

      # The Windows workflow adds its installer to the same release, and either can get there
      # first: create the release if it isn't there yet, then upload.
      - name: Add the installer to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Astralay ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag \
            || gh release view "$GITHUB_REF_NAME" > /dev/null
          gh release upload "$GITHUB_REF_NAME" build/installer/*.pkg --clobber
