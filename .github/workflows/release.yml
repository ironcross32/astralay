name: Release

# Builds the macOS and Windows installers, and a ZIP of each plugin format for installing by hand,
# then publishes all five as the tag's GitHub release. Run by hand from the Actions tab, it builds
# the same five files and keeps each as a workflow artifact instead, without touching any release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The installers take their version from the build, so a tag that disagrees with CMakeLists.txt
  # would publish a mislabelled release. Catch it before the builds rather than after.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Read the project version
        id: read
        run: |
          version="$(sed -n 's/^project(Astralay VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ -z "$version" ]; then
            echo "::error::Can't read the version from CMakeLists.txt"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Build the installer
        run: installer/mac/build-pkg.sh

      # Workflow artifacts drop file permissions, which would break the bundles and their
      # signatures, so the plugins travel to the release job inside a ZIP of their own.
      - name: Gather the installer and the plugins
        run: |
          artefacts=build/Astralay_artefacts/Release
          mkdir -p build/dist build/plugins/VST3/macOS build/plugins/CLAP/macOS build/plugins/AU/macOS
          cp build/installer/*.pkg build/dist/
          ditto "$artefacts/VST3/Astralay.vst3" build/plugins/VST3/macOS/Astralay.vst3
          ditto "$artefacts/CLAP/Astralay.clap" build/plugins/CLAP/macOS/Astralay.clap
          ditto "$artefacts/AU/Astralay.component" build/plugins/AU/macOS/Astralay.component
          (cd build/plugins && zip -r -y -q ../dist/macos-plugins.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build/dist/
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup if the runner doesn't have it
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build the installer
        run: installer\windows\build-installer.ps1

      # Not build\release: Windows ignores case, so that's the build's own Release folder, which
      # holds its libraries.
      - name: Gather the installer and the plugins
        run: |
          $artefacts = "build\Astralay_artefacts\Release"
          New-Item -ItemType Directory -Force build\dist\plugins\VST3\Windows, build\dist\plugins\CLAP\Windows | Out-Null
          Copy-Item build\installer\*.exe build\dist
          Copy-Item -Recurse $artefacts\VST3\Astralay.vst3 build\dist\plugins\VST3\Windows
          Copy-Item $artefacts\CLAP\Astralay.clap build\dist\plugins\CLAP\Windows

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/dist/
          if-no-files-found: error

  release:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To delete the build jobs' artifacts.
      actions: write

    steps:
      # For the licences and the installation notes that go in the ZIPs.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the ZIPs and the release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p zip release
          unzip -q artifacts/build-macos/macos-plugins.zip -d zip
          cp -R artifacts/build-windows/plugins/. zip/
          for format in VST3 CLAP AU; do
            cp LICENSE "zip/$format/LICENSE.txt"
            cp LICENSE-AGPL-3.0.txt THIRD_PARTY_NOTICES.md "zip/$format/"
            cp installer/manual-install.txt "zip/$format/How to install.txt"
            (cd "zip/$format" && zip -r -y -q "../../release/Astralay-$VERSION-$format.zip" .)
          done
          cp artifacts/build-macos/*.pkg artifacts/build-windows/*.exe release/
          ls -l release

      # The build jobs' artifacts were only for getting the files here. Without this, a run by
      # hand would list them alongside the five files below.
      - name: Remove the build jobs' artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          for id in $(gh api "$artifacts" --jq '.artifacts[] | select(.name | startswith("build-")) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      # One artifact per file, uploaded as it is rather than wrapped in a ZIP. Each takes its
      # file's name.
      - name: Keep the Windows installer as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: release/Astralay-${{ needs.version.outputs.version }}-Windows.exe
          archive: false
          if-no-files-found: error

      - name: Keep the macOS installer as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: release/Astralay-${{ needs.version.outputs.version }}-macOS.pkg
          archive: false
          if-no-files-found: error

      - name: Keep the VST3 as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: release/Astralay-${{ needs.version.outputs.version }}-VST3.zip
          archive: false
          if-no-files-found: error

      - name: Keep the CLAP as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: release/Astralay-${{ needs.version.outputs.version }}-CLAP.zip
          archive: false
          if-no-files-found: error

      - name: Keep the AU as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: release/Astralay-${{ needs.version.outputs.version }}-AU.zip
          archive: false
          if-no-files-found: error

      # Create the release unless a rerun finds it already there, then upload.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Astralay ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag \
            || gh release view "$GITHUB_REF_NAME" > /dev/null
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
